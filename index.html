<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EduSmart System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#f3f6fa;--cd:#fff;--tx:#12263f;--mu:#5a6b80;--pr:#12305a;--ac:#2f7fd8;--am:#f2b01e;--bd:#d5dfeb;--ok:#13783a;--er:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0d1b2e;--cd:#16283f;--tx:#e6eefa;--mu:#9bb0c9;--pr:#7fb4f0;--ac:#5ea2ec;--bd:#2b4260;--ok:#5fd68a;--er:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--cd);border-bottom:1px solid var(--bd)}
.brand{font-weight:700;font-size:20px;color:var(--pr)}.brand span{color:var(--ac)}
button,select,input{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--bd);background:var(--cd);border-radius:8px;padding:8px 14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--am);outline-offset:1px}
.pri{background:var(--pr);color:var(--bg);border-color:var(--pr);font-weight:700}
.wrap{display:flex;min-height:calc(100vh - 60px)}nav{width:210px;padding:16px 12px;border-right:1px solid var(--bd);background:var(--cd);flex:none}
nav button{display:block;width:100%;text-align:left;margin-bottom:6px;border:0;background:none}nav button.on{background:var(--pr);color:var(--bg);font-weight:700}
main{flex:1;padding:24px;max-width:900px;min-width:0}h1{margin:0 0 8px;font-size:26px;color:var(--pr)}.mu{color:var(--mu)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:0 0 14px}
label{display:block;font-weight:700;margin:10px 0 4px}input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}.tw{overflow-x:auto}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;border:1px solid var(--bd);font-size:14px}.ok{color:var(--ok)}.er{color:var(--er)}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);padding:10px 18px;border-radius:8px;background:var(--pr);color:var(--bg);z-index:30;display:none;max-width:90vw}
@media(max-width:700px){.wrap{display:block}nav{width:auto;display:flex;overflow-x:auto;gap:6px;border-right:0;border-bottom:1px solid var(--bd)}nav button{width:auto;white-space:nowrap;margin:0}main{padding:16px}}
</style></head><body>
<header><div class="brand">Edu<span>Smart</span> System</div><div id="hr"></div></header>
<div id="app"></div><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),v=i=>($("#"+i)||{}).value||"";
const e=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ES={pendiente:"Pendiente de validación",en_revision:"En revisión",aprobada:"Aprobada",rechazada:"Rechazada"};
const MENU={acudiente:[["hijos","Mis hijos"],["nueva","Inscripción nueva"],["regular","Matrícula regular"],["cuenta","Estado de cuenta"],["pagar","Pagar servicios"]],admin:[["insc","Inscripciones"],["cargos","Cargos"],["pagos","Pagos recibidos"]],docente:[["pronto","Próximamente"]],estudiante:[["pronto","Próximamente"]]};
const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${h.length}" class="mu">Aún no hay registros.</td></tr>`}</table></div>`;
let sb,me=null,view="";
function toast(t){const x=$("#toast");x.textContent=t;x.style.display="block";clearTimeout(x._t);x._t=setTimeout(()=>x.style.display="none",3500)}
const fail=er=>(toast(er.message||"Ocurrió un error"),`<p class="er">${e(er.message||"Error")}</p>`);

function login(){
  $("#hr").innerHTML="";
  $("#app").innerHTML=`<main style="margin:auto;max-width:420px"><h1>Bienvenido a EduSmart</h1><div class="card">
  <label for="nm">Nombre completo (solo si creas cuenta)</label><input id="nm" autocomplete="name">
  <label for="em">Correo</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Contraseña (mínimo 6 caracteres)</label><input id="pw" type="password" autocomplete="current-password">
  <p><button class="pri" onclick="auth(false)">Iniciar sesión</button> <button onclick="auth(true)">Crear cuenta de acudiente</button></p></div></main>`;
}
async function auth(reg){
  const email=v("em").trim(),password=v("pw");
  if(!email||password.length<6)return toast("Escribe tu correo y una contraseña de mínimo 6 caracteres.");
  if(reg){
    const nombre=v("nm").trim();if(!nombre)return toast("Escribe tu nombre completo.");
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{nombre}}});
    if(error)return toast(error.message);
    if(!data.session)return toast("Cuenta creada. Revisa tu correo para confirmarla.");
    return entrar(data.user);
  }
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error)return toast("Correo o contraseña incorrectos.");
  entrar(data.user);
}
async function entrar(u){
  const {data,error}=await sb.from("profiles").select("*").eq("id",u.id).single();
  if(error)return toast("No se pudo cargar tu perfil: "+error.message);
  me=data;view=MENU[me.rol][0][0];shell();
}
async function salir(){await sb.auth.signOut();me=null;login()}
function go(k){view=k;shell()}
async function shell(){
  $("#hr").innerHTML=`<span class="mu">${e(me.nombre||"")} · ${e(me.rol)}</span> <button onclick="salir()">Salir</button>`;
  $("#app").innerHTML=`<div class="wrap"><nav>${MENU[me.rol].map(([k,l])=>`<button class="${k==view?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}</nav><main id="mn">Cargando…</main></div>`;
  $("#mn").innerHTML=await V[view]();
}
const V={
  async hijos(){
    const {data,error}=await sb.from("estudiantes").select("id,nombres,apellidos,matriculas(anio_lectivo,grado,estado)").order("created_at");
    if(error)return fail(error);
    const rows=data.flatMap(s=>{const n=e(s.nombres+" "+s.apellidos);return s.matriculas.length?s.matriculas.map(m=>[n,m.anio_lectivo,e(m.grado),`<span class="tag ${m.estado=="aprobada"?"ok":m.estado=="rechazada"?"er":""}">${ES[m.estado]}</span>`]):[[n,"—","—","Sin matrícula"]]});
    return `<h1>Mis hijos</h1><p class="mu">Aquí ves el estado de la matrícula de cada estudiante.</p>`+tbl(["Estudiante","Año lectivo","Grado","Estado"],rows);
  },
  async nueva(){
    const y=new Date().getFullYear();
    return `<h1>Inscripción nueva</h1><div class="card"><label for="n1">Nombres del estudiante</label><input id="n1"><label for="n2">Apellidos</label><input id="n2">
    <label for="n3">Fecha de nacimiento</label><input id="n3" type="date"><label for="n4">Año lectivo</label><input id="n4" type="number" value="${y+1}">
    <label for="n5">Nivel al que se inscribe</label><select id="n5">${["7°","8°","9°","10°","11°","12°"].map(g=>`<option>${g}</option>`).join("")}</select>
    <p><button class="pri" onclick="inscribir()">Enviar inscripción</button></p></div>`;
  },
  async insc(){
    const {data,error}=await sb.from("matriculas").select("id,anio_lectivo,grado,estado,estudiantes(nombres,apellidos,profiles(nombre))").order("created_at",{ascending:false});
    if(error)return fail(error);
    const rows=data.map(m=>{const s=m.estudiantes||{};const b=["pendiente","en_revision"].includes(m.estado)?`<button class="pri" onclick="cambiar('${m.id}','aprobada')">Aprobar</button> <button onclick="cambiar('${m.id}','rechazada')">Rechazar</button>`:"";
      return [e((s.nombres||"")+" "+(s.apellidos||"")),e((s.profiles||{}).nombre||"—"),m.anio_lectivo,e(m.grado),ES[m.estado],b]});
    return `<h1>Inscripciones</h1>`+tbl(["Estudiante","Acudiente","Año","Grado","Estado",""],rows);
  },
  async regular(){
    const {data,error}=await sb.from("estudiantes").select("id,nombres,apellidos,matriculas(anio_lectivo,grado),cargos(estado,monto)").order("created_at");
    if(error)return fail(error);
    const G=["7°","8°","9°","10°","11°","12°"];
    const cards=data.map(s=>{
      const u=s.matriculas.slice().sort((a,b)=>b.anio_lectivo-a.anio_lectivo)[0],n=e(s.nombres+" "+s.apellidos);
      const debe=s.cargos.filter(c=>c.estado=="pendiente").reduce((t,c)=>t+Number(c.monto),0);
      if(debe>0)return `<div class="card"><b>${n}</b><p class="er">No se puede matricular: tiene un saldo pendiente de $${debe.toFixed(2)}. Revisa Estado de cuenta.</p></div>`;
      const y=u?u.anio_lectivo+1:new Date().getFullYear()+1,gi=u?Math.min(G.indexOf(u.grado)+1,5):0;
      return `<div class="card"><b>${n}</b> <span class="mu">${u?"Última matrícula: "+u.anio_lectivo+" ("+e(u.grado)+")":"Sin matrículas"}</span>
      <label for="y${s.id}">Año lectivo</label><input id="y${s.id}" type="number" value="${y}">
      <label for="g${s.id}">Nivel</label><select id="g${s.id}">${G.map((g,i)=>`<option ${i==gi?"selected":""}>${g}</option>`).join("")}</select>
      <p><button class="pri" onclick="rematricular('${s.id}')">Solicitar matrícula</button></p></div>`}).join("");
    return `<h1>Matrícula regular</h1><p class="mu">Para estudiantes que ya están en el colegio. Con saldo pendiente no se puede matricular.</p>`+(cards||`<p class="mu">Aún no tienes estudiantes registrados.</p>`);
  },
  async cuenta(){
    const {data,error}=await sb.from("cargos").select("concepto,monto,estado,created_at,estudiantes(nombres,apellidos)").order("created_at",{ascending:false});
    if(error)return fail(error);
    const tot=data.filter(c=>c.estado=="pendiente").reduce((t,c)=>t+Number(c.monto),0);
    return `<h1>Estado de cuenta</h1><p>Saldo pendiente: <b class="${tot?"er":"ok"}">$${tot.toFixed(2)}</b></p>`+tbl(["Fecha","Estudiante","Concepto","Monto","Estado"],data.map(c=>[c.created_at.slice(0,10),e(c.estudiantes.nombres+" "+c.estudiantes.apellidos),e(c.concepto),"$"+Number(c.monto).toFixed(2),`<span class="tag ${c.estado=="pagado"?"ok":"er"}">${c.estado=="pagado"?"Pagado":"Pendiente"}</span>`]));
  },
  async cargos(){
    const [a,b]=await Promise.all([sb.from("estudiantes").select("id,nombres,apellidos").order("nombres"),sb.from("cargos").select("id,concepto,monto,estado,estudiantes(nombres,apellidos)").order("created_at",{ascending:false})]);
    if(a.error||b.error)return fail(a.error||b.error);
    return `<h1>Cargos</h1><div class="card"><label for="c1">Estudiante</label><select id="c1">${a.data.map(s=>`<option value="${s.id}">${e(s.nombres+" "+s.apellidos)}</option>`).join("")}</select>
    <label for="c2">Concepto</label><input id="c2" placeholder="Ej: Mensualidad de noviembre"><label for="c3">Tipo</label><select id="c3"><option value="mensualidad">Mensualidad</option><option value="uniforme">Uniforme</option><option value="otro">Otro</option></select>
    <label for="c4">Monto ($)</label><input id="c4" type="number" min="0.01" step="0.01"><p><button class="pri" onclick="addCargo()">Agregar cargo</button></p></div>`+tbl(["Estudiante","Concepto","Monto","Estado",""],b.data.map(c=>[e(c.estudiantes.nombres+" "+c.estudiantes.apellidos),e(c.concepto),"$"+Number(c.monto).toFixed(2),c.estado=="pagado"?"Pagado":"Pendiente",c.estado=="pendiente"?`<button onclick="marcarPagado('${c.id}')">Marcar pagado</button>`:""]));
  },
  async pagar(){
    const [a,b]=await Promise.all([
      sb.from("cargos").select("id,concepto,monto,estudiantes(nombres,apellidos)").eq("estado","pendiente").order("created_at"),
      sb.from("pagos").select("concepto,monto,forma,created_at,estudiantes(nombres,apellidos)").order("created_at",{ascending:false})]);
    if(a.error||b.error)return fail(a.error||b.error);
    const pend=a.data.map(c=>`<div class="card"><b>${e(c.concepto)}</b> — $${Number(c.monto).toFixed(2)}<br><span class="mu">${e(c.estudiantes.nombres+" "+c.estudiantes.apellidos)}</span>
      <label for="f${c.id}">Forma de pago</label><select id="f${c.id}"><option value="tarjeta">Tarjeta</option><option value="transferencia">Transferencia</option></select>
      <p><button class="pri" onclick="pagar('${c.id}')">Confirmar y pagar</button></p></div>`).join("")||`<div class="card ok">No tienes pagos pendientes.</div>`;
    return `<h1>Pagar servicios</h1>${pend}<p class="mu">Prototipo: el pago es simulado. No se piden ni se guardan datos de tarjeta.</p><h2>Historial de pagos</h2>`+tbl(["Fecha","Estudiante","Concepto","Forma","Monto"],b.data.map(p=>[p.created_at.slice(0,10),e(p.estudiantes.nombres+" "+p.estudiantes.apellidos),e(p.concepto),e(p.forma),"$"+Number(p.monto).toFixed(2)]));
  },
  async pagos(){
    const {data,error}=await sb.from("pagos").select("concepto,monto,forma,created_at,estudiantes(nombres,apellidos)").order("created_at",{ascending:false});
    if(error)return fail(error);
    const tot=data.reduce((t,p)=>t+Number(p.monto),0);
    return `<h1>Pagos recibidos</h1><p>Total recibido: <b>$${tot.toFixed(2)}</b></p>`+tbl(["Fecha","Estudiante","Concepto","Forma","Monto"],data.map(p=>[p.created_at.slice(0,10),e(p.estudiantes.nombres+" "+p.estudiantes.apellidos),e(p.concepto),e(p.forma),"$"+Number(p.monto).toFixed(2)]));
  },
  async pronto(){return `<h1>Próximamente</h1><p class="mu">Este módulo se conecta en la siguiente fase.</p>`}
};
async function inscribir(){
  const nombres=v("n1").trim(),apellidos=v("n2").trim(),f=v("n3");
  if(!nombres||!apellidos||!f)return toast("Completa nombres, apellidos y fecha de nacimiento.");
  const {data:s,error}=await sb.from("estudiantes").insert({acudiente_id:me.id,nombres,apellidos,fecha_nacimiento:f}).select().single();
  if(error)return toast(error.message);
  const {error:e2}=await sb.from("matriculas").insert({estudiante_id:s.id,anio_lectivo:Number(v("n4")),grado:v("n5")});
  if(e2)return toast(e2.message);
  toast("Inscripción enviada. Administración la revisará.");go("hijos");
}
async function cambiar(id,estado){
  const {data,error}=await sb.from("matriculas").update({estado}).eq("id",id).select();
  if(error)return toast(error.message);
  if(!data.length)return toast("No tienes permiso para esta acción.");
  toast("Matrícula "+ES[estado].toLowerCase()+".");go("insc");
}
async function rematricular(id){
  const {error}=await sb.from("matriculas").insert({estudiante_id:id,anio_lectivo:Number(v("y"+id)),grado:v("g"+id)});
  if(error)return toast(error.code=="23505"?"Ya existe una matrícula de ese estudiante para ese año.":error.code=="42501"?"No se puede matricular: revisa si tiene saldo pendiente.":error.message);
  toast("Solicitud enviada. Administración la revisará.");go("hijos");
}
async function addCargo(){
  const monto=Number(v("c4")),concepto=v("c2").trim();
  if(!concepto||!(monto>0))return toast("Indica el concepto y un monto mayor que 0.");
  const {error}=await sb.from("cargos").insert({estudiante_id:v("c1"),concepto,tipo:v("c3"),monto});
  if(error)return toast(error.message);
  toast("Cargo agregado.");go("cargos");
}
async function pagarCargo(id,forma){
  const {error}=await sb.rpc("pagar_cargo",{p_cargo:id,p_forma:forma});
  if(error){toast(error.message);return false}
  return true;
}
async function marcarPagado(id){if(await pagarCargo(id,"transferencia")){toast("Cargo marcado como pagado.");go("cargos")}}
async function pagar(id){if(await pagarCargo(id,v("f"+id))){toast("Pago exitoso. Gracias.");go("pagar")}}
if(SUPABASE_URL.includes("PEGA_AQUI")){$("#app").innerHTML="<main><h1>Falta configurar</h1><p>Abre config.js y pega tu Project URL y tu Publishable key en las dos líneas indicadas.</p></main>"}
else{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.getSession().then(({data})=>data.session?entrar(data.session.user):login())}
</script></body></html>
