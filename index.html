<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control de acceso SAS</title><script src="https://unpkg.com/html5-qrcode" defer></script><style>*{box-sizing:border-box}body{margin:0;padding:24px 16px 40px;font-family:Arial,sans-serif;text-align:center;color:#16212e;background:#eef3f8}main{max-width:440px;margin:auto}h1{color:#12355b;font-size:25px;margin:8px 0}.sub{color:#526171;margin:0 0 18px}#configuracion{background:#fff;padding:18px;border-radius:12px}#lector{display:none}#reader{display:none;width:100%;overflow:hidden;border-radius:12px;background:#fff}input{width:100%;padding:14px;font-size:16px;border:1px solid #aebdcb;border-radius:10px;margin:8px 0}button{width:100%;padding:16px;margin:7px 0;font-size:16px;font-weight:bold;border:0;border-radius:10px;cursor:pointer}#guardar,#scan{background:#12355b;color:#fff}#manual{background:#e3a008;color:#231b00}#stop{display:none;background:#d9e2ec;color:#16212e}#status{min-height:100px;margin-top:18px;padding:18px;border-radius:12px;background:#fff;font-size:18px;font-weight:bold;display:flex;align-items:center;justify-content:center}#status.ok{background:#d7f2df;color:#14532d}#status.no{background:#fde0e0;color:#7f1d1d}#status.wait{background:#e3edf8;color:#12355b}</style></head><body><main><h1>CONTROL DE ACCESO SAS</h1><p class="sub">Escanee el QR o ingrese el código manualmente.</p><section id="configuracion"><p><strong>Configuración inicial</strong></p><p>Pegue la URL de Apps Script que termina en <code>/exec</code>.</p><input id="appsUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec"><button id="guardar">GUARDAR Y CONECTAR</button></section><section id="lector"><button id="scan">ABRIR CÁMARA Y ESCANEAR QR</button><div id="reader"></div><button id="stop">CERRAR CÁMARA</button><input id="code" type="text" autocomplete="off" placeholder="Código manual, ej. SAS-001-01"><button id="manual">VALIDAR CÓDIGO MANUAL</button></section><div id="status" class="wait">Configure la conexión para comenzar.</div></main><script>const statusBox=document.getElementById('status'),configBox=document.getElementById('configuracion'),lectorBox=document.getElementById('lector'),urlInput=document.getElementById('appsUrl');let apiUrl='',scanner=null,validating=false;function mostrar(t,k){statusBox.className=k||'';statusBox.innerHTML=t}function esc(t){return String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function conectar(url){url=String(url||'').trim();if(!url.includes('/exec'))return mostrar('Pegue una URL válida de Apps Script que termine en /exec.','no');apiUrl=url;localStorage.setItem('sasAppsUrl',url);configBox.style.display='none';lectorBox.style.display='block';mostrar('Listo para validar.','wait')}document.getElementById('guardar').onclick=()=>conectar(urlInput.value);function validar(codigo){codigo=String(codigo||'').trim();if(!codigo||validating)return;if(!apiUrl)return mostrar('Configure la URL de Apps Script.','no');validating=true;mostrar('VALIDANDO…','wait');const callback='SASQR_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let terminado=false;const limpiar=()=>{if(terminado)return;terminado=true;clearTimeout(reloj);delete window[callback];s.remove()};window[callback]=r=>{limpiar();validating=false;if(r.valido)mostrar('✓ ACCESO VÁLIDO<br><br>'+esc(r.estudiante)+'<br>Acceso '+esc(r.acceso)+'<br><br>COLOQUE EL CINTILLO','ok');else mostrar('✕ '+esc(r.mensaje)+(r.estudiante?'<br><br>'+esc(r.estudiante):''),'no');document.getElementById('code').value='';detenerCamara()};const reloj=setTimeout(()=>{limpiar();validating=false;mostrar('No hubo respuesta. Revise la URL y la conexión.','no')},15000);s.onerror=()=>{limpiar();validating=false;mostrar('No se pudo conectar con Apps Script.','no')};s.src=apiUrl+(apiUrl.includes('?')?'&':'?')+'codigo='+encodeURIComponent(codigo)+'&prefix='+callback+'&r='+Date.now();document.head.appendChild(s)}async function iniciarCamara(){if(!window.Html5Qrcode)return mostrar('No se pudo cargar el lector. Revise Internet.','no');document.getElementById('reader').style.display='block';document.getElementById('scan').style.display='none';document.getElementById('stop').style.display='block';scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},t=>validar(t),()=>{});mostrar('Apunte la cámara al código QR.','wait')}catch(e){mostrar('No se pudo abrir la cámara. Permita el uso de la cámara y vuelva a intentar.','no');detenerCamara()}}async function detenerCamara(){if(scanner){try{await scanner.stop()}catch(e){}try{await scanner.clear()}catch(e){}scanner=null}document.getElementById('reader').style.display='none';document.getElementById('scan').style.display='block';document.getElementById('stop').style.display='none'}document.getElementById('scan').onclick=iniciarCamara;document.getElementById('stop').onclick=detenerCamara;document.getElementById('manual').onclick=()=>validar(document.getElementById('code').value);document.getElementById('code').onkeydown=e=>{if(e.key==='Enter')validar(e.target.value)};const guardada=localStorage.getItem('sasAppsUrl');if(guardada)conectar(guardada)</script></body></html>
